    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #ffffff;
            overflow-x: hidden;
        }

        .title-font {
            font-family: 'Montserrat', sans-serif;
        }

        /* Neon fluor text glow effects */
        .neon-title {
            text-shadow: 
                0 0 7px #fff,
                0 0 10px #fff,
                0 0 21px #00ffcc,
                0 0 42px #00ffcc,
                0 0 82px #00ffcc;
        }

        .neon-gold {
            text-shadow: 
                0 0 5px #fff,
                0 0 15px #ffea00,
                0 0 30px #ff007f;
        }

        /* Pulsing green status dot */
        .pulse-dot {
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 10px rgba(34, 197, 94, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
            }
        }

        /* Background Poker Floating Symbols */
        .poker-bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .poker-symbol {
            position: absolute;
            opacity: 0.25;
            filter: drop-shadow(0 0 10px currentColor);
            animation: float 14s infinite ease-in-out;
            user-select: none;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg) scale(1);
            }
            50% {
                transform: translateY(-25px) rotate(15deg) scale(1.1);
            }
        }

        /* Fluor Colors */
        .color-pink { color: #ff007f; }
